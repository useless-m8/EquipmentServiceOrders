services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-equipment_service}
      POSTGRES_USER: ${POSTGRES_USER:-equipment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-equipment}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-equipment} -d ${POSTGRES_DB:-equipment_service}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
