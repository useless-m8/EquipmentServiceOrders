{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'homepage/style.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="site-nav">
        <div class="container nav-inner">
            <a class="brand" href="{% url 'index' %}">
                <span class="brand-mark">Э</span><span>Технопрокат</span>
            </a>
            <div class="nav-links">
                <a class="nav-link" href="{% url 'index' %}">Главная</a>
                <a class="nav-link" href="{% url 'equipment_list' %}">Оборудование</a>
                <a class="nav-link" href="{% url 'booking_list' %}">Бронирования</a>
            </div>
        </div>
    </nav>
    <main class="container main-content">{% block content %}{% endblock %}</main>
    <footer class="site-footer">
        <div class="container">Сервис бронирования оборудования</div>
    </footer>
</body>
</html>
