{% extends "base.html" %}

{% block content %}
<h1 class="mb-3">Бронирования</h1>
<ul class="list-group">
    {% for booking in bookings %}
    <li class="list-group-item d-flex justify-content-between">
        <a href="{% url 'booking_detail' booking.id %}">#{{ booking.id }} · {{ booking.equipment.name }} · {{ booking.period }}</a>
        <span class="badge text-bg-{% if booking.is_cancelled %}secondary{% else %}success{% endif %}">{{ booking.status }}</span>
    </li>
    {% empty %}
    <li class="list-group-item">Бронирований пока нет.</li>
    {% endfor %}
</ul>
{% endblock %}
